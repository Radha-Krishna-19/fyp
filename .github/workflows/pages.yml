# Site checks and GitHub Pages deployment
#
# On every push to main this workflow:
#   1. runs every JavaScript test suite in website/tests (the pages are loaded headlessly
#      and every computed number is checked against the Python result files);
#   2. runs the Python smoke test of the spectrum pipeline;
#   3. rebuilds the site from website/_build and fails if a built page was edited by hand;
#   4. publishes website/ to GitHub Pages, only if the three checks pass.
#
# One-time repository setting required for step 4:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Site checks and Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-js:
    name: JavaScript test suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - name: Run every suite in website/tests
        working-directory: website/tests
        run: |
          npm install --no-audit --no-fund jsdom
          for f in test_*.js; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done

  test-python:
    name: Python spectrum pipeline smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - name: Install dependencies
        run: pip install numpy networkx
      - name: Run the smoke test
        working-directory: code/spectrum_pipeline
        run: python _ci_smoke_test.py

  build-check:
    name: Built HTML matches its sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - name: Rebuild the site from website/_build
        run: python website/_build/build_site.py
      - name: Fail if the rebuild changed committed HTML
        run: |
          if ! git diff --quiet -- website/*.html; then
            echo "::error::A built page differs from its source. Edit website/_build/content_source.html"
            echo "::error::or website/_build/fragments/*.html and run build_site.py. Diff:"
            git diff -- website/*.html
            exit 1
          fi

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test-js, test-python, build-check]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Check the site is self-contained
        working-directory: website
        run: |
          test -s three.min.js || { echo "three.min.js is missing"; exit 1; }
          ! grep -rn 'src="/\|href="/' --include='*.html' . || {
            echo "absolute path found: it would break under the /fyp/ prefix of GitHub Pages"; exit 1; }
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v5
