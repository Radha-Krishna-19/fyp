# Runs on every push to main: the full JS test suite, a Python smoke test,
# and a check that the built HTML matches what build_site.py would produce
# from the current fragments/content_source (so nobody can hand-edit the
# built pages without CI catching it -- see CLAUDE.md's "the website is
# built, not hand-edited" rule).
#
# Publishing to GitHub Pages is NOT wired to push -- Pages isn't enabled on
# this repo right now, and a "deploy" job that fails for that reason on
# every push is a false red X that has nothing to do with whether the code
# is good. Deploy is kept, but only as a manual action (Actions tab -> Run
# workflow), for whenever Pages does get turned on.
#
# WHY A WORKFLOW RATHER THAN "DEPLOY FROM BRANCH", if that day comes
# Pages' branch mode can only serve the repository root or /docs. The site
# lives in 1_website/, so branch mode would either need the site moved (which
# breaks every path in the project layout) or a redirect stub at the root
# (which makes the published URL ugly and the redirect visible). This uploads
# 1_website/ AS the site root, so the published URL is clean and nothing in
# the repository has to move.
name: Site checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # also lets you deploy on demand, see the `deploy` job

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. If a second run lands mid-deploy the queued
# run is replaced rather than both writing to the same target.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-js:
    name: JavaScript test suites (all 9)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22' }

      # The site computes its numbers in the browser at load time, so a broken
      # engine script renders a blank panel and throws no visible error. These
      # suites boot the real pages headlessly and assert on computed output.
      # Publishing a silently-empty site, or a page with a wrong number on
      # it, is the failure this prevents. All 9 suites in tests/, not a
      # subset -- a suite left out of CI is a suite nobody is actually
      # running on every push.
      - name: Run every suite in 1_website/tests
        working-directory: 1_website/tests
        run: |
          npm install --no-audit --no-fund jsdom
          for f in test_*.js; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done

  test-python:
    name: Python reference pipeline smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - name: Install dependencies
        run: pip install numpy networkx
      - name: Run the CI smoke test
        working-directory: 2_python
        run: python _ci_smoke_test.py

  build-check:
    name: Built HTML matches the source (no hand-edits)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: '3.11' }
      - name: Rebuild the site from content_source and fragments
        run: python 1_website/_build/build_site.py
      - name: Fail if the rebuild changed anything that was committed
        run: |
          if ! git diff --quiet -- 1_website/*.html; then
            echo "::error::Rebuilding the site changed committed HTML. Someone edited"
            echo "::error::a built page directly instead of editing _build/content_source.html"
            echo "::error::or _build/fragments/*.html and re-running build_site.py. Diff:"
            git diff -- 1_website/*.html
            exit 1
          fi

  # Deploy to GitHub Pages -- MANUAL ONLY (Actions tab -> "Site checks" ->
  # Run workflow). Does not run on push, so it cannot fail a normal push
  # just because Pages hasn't been switched on in Settings yet.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: [test-js, test-python, build-check]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6

      - name: Check the site is self-contained
        working-directory: 1_website
        run: |
          # three.js is vendored so a clone works offline. If this file went
          # missing the 3D views would silently fall back to a CDN, and the
          # "works with no network" claim in the README would be false.
          test -s three.min.js || { echo "three.min.js is missing"; exit 1; }
          # No absolute paths: everything must resolve relative to the page,
          # or the site breaks under the /<repo>/ prefix Pages serves from.
          ! grep -rn 'src="/\|href="/' --include='*.html' . || {
            echo "absolute path found — it will 404 under the Pages sub-path"; exit 1; }

      - uses: actions/upload-pages-artifact@v5
        with:
          path: 1_website

      - id: deployment
        uses: actions/deploy-pages@v5
